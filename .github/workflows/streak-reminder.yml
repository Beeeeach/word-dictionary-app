name: Streak Reminder

# ストリークが途切れそうなユーザーに夜リマインド通知を送る。
on:
  schedule:
    - cron: "0 12 * * *" # UTC 12:00 = 日本時間 21:00
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call streak-reminder endpoint
        run: |
          curl -sf -X GET \
            "${{ secrets.APP_URL }}/api/cron/streak-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
